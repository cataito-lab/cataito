name: Refresh Tool Health

# P4.3 内容保鲜闭环：每日对全部收录条目做存活探测，连续失败自动降级（详情页横幅），
# 连续 4 次 DEAD 自动开 issue 交人工裁决（收录纪律：机器降级、人工删除）。
# 判定必须在海外 CI 环境做（国内本地网络会误判 UNREACHABLE）。
# cron 避开整点（GitHub 高峰丢调度）。

on:
  schedule:
    # 主跑：每日 UTC 04:11（北京 12:11）
    - cron: '11 4 * * *'
    # 备份：每日 UTC 10:47（北京 18:47）——错峰 6.5 小时，防单条 schedule 被静默丢弃
    # 判定必须在海外 CI 环境做（国内本地网络会误判 UNREACHABLE）；备份 cron 也走海外 runner。
    - cron: '47 10 * * *'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  health:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run health probe and auto-open issues for persistent DEAD entries
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/refresh-tool-health.mjs --auto-issue

      - name: Commit results (if changed)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/tool-health.json
          if git diff --cached --quiet; then
            echo "健康数据无变化"
          else
            git commit -m "chore(data): 每日存活巡检 $(date -u +%F)"
            for i in 1 2 3; do
              if git push; then break; fi
              git pull --rebase || true
            done
          fi
