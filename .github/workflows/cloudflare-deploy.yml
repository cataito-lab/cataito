name: Cloudflare Pages Deploy

on:
  push:
    branches: [main]
  # 数据机器人（refresh-stars / refresh-tool-health / refresh-ranking）用 GITHUB_TOKEN
  # push 到 main，GitHub 防循环设计使这类 push 不触发上面的 push 事件——每日数据提交
  # 长期滞留仓库不上线（2026-09-11 发现线上停在 09-09 构建，机器人 09-09/09-10 共 10
  # 个提交未部署）。workflow_run 是官方豁免通道：机器人在 main 上跑完即部署最新代码。
  workflow_run:
    workflows: ['Refresh Stars', 'Refresh Tool Health', 'Update Ranking']
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      smoke_test:
        description: 'Run smoke test against https://cataito.com/en after deploy'
        type: boolean
        required: false
        default: false

jobs:
  deploy:
    # workflow_run 通道：机器人自身失败时无新数据可上线，跳过部署
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    env:
      CF_ACCOUNT_ID: 8f9029f4b262cd970bccf8e07200942e
      CF_PROJECT_NAME: cataito

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # workflow_run 触发时 github.sha 是机器人运行前检出的旧 commit，
          # 必须 ref main 才能带上机器人刚推送的数据提交
          ref: ${{ github.event_name == 'workflow_run' && 'main' || github.sha }}

      - name: Resolve deployed commit
        id: head
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build (static export)
        run: npm run build

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ env.CF_ACCOUNT_ID }}
        run: npx wrangler pages deploy out --project-name=${{ env.CF_PROJECT_NAME }} --branch=main --commit-hash=${{ steps.head.outputs.sha }}

      # IndexNow 即时推送（P3.1）：部署成功后把 sitemap 全部 URL 推给 Bing/Yandex
      # （ChatGPT 搜索的底层数据源是 Bing）。key 为公开标识文件 public/<key>.txt，非机密。
      # 提交失败不阻塞部署（仅告警）——continue-on-error 确保部署本身保持绿色。
      - name: Submit URLs to IndexNow
        if: success()
        continue-on-error: true
        run: node scripts/indexnow-submit.mjs

      - name: Smoke test (opt-in via workflow_dispatch)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.smoke_test == true }}
        run: |
          echo "Running smoke test against https://cataito.com/en ..."
          curl -sSI https://cataito.com/en | head -20
          echo "---"
          curl -sSI https://cataito.com/en/tool/chatgpt | head -20
          echo "---"
          curl -sSI https://cataito.com/zh | head -20
          echo "---"
          curl -sSI https://cataito.com/tool/chatgpt | head -20
