name: Cloudflare Pages Deploy

# 部署通道架构（2026-09-11 站长拍板，v7.23）：
#   自动部署 = Cloudflare Pages Git 集成（生产分支 main 启用、预览分支禁用）。
#   本工作流降级为**手动 fallback**：CF 通道挂了或想跑 smoke test 时手动 dispatch。
#   历史：9/3（v6.86）曾因双通道打架（Actions npm install vs CF npm ci lock 漂移）
#   关掉 CF 自动部署改走 Actions；9/11 站长重开 CF 自动部署，故把 Actions 侧自动
#   触发摘掉，避免每次 push 双部署竞争 + 状态分裂。lock 已于 09fdfa7 同步、npm ci 通过。
on:
  workflow_dispatch:
    inputs:
      smoke_test:
        description: 'Run smoke test against https://cataito.com/en after deploy'
        type: boolean
        required: false
        default: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CF_ACCOUNT_ID: 8f9029f4b262cd970bccf8e07200942e
      CF_PROJECT_NAME: cataito

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build (static export)
        run: npm run build

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ env.CF_ACCOUNT_ID }}
        run: npx wrangler pages deploy out --project-name=${{ env.CF_PROJECT_NAME }} --branch=main --commit-hash=${{ github.sha }}

      # IndexNow 即时推送（P3.1）：部署成功后把 sitemap 全部 URL 推给 Bing/Yandex
      # （ChatGPT 搜索的底层数据源是 Bing）。key 为公开标识文件 public/<key>.txt，非机密。
      # 提交失败不阻塞部署（仅告警）——continue-on-error 确保部署本身保持绿色。
      - name: Submit URLs to IndexNow
        if: success()
        continue-on-error: true
        run: node scripts/indexnow-submit.mjs

      - name: Smoke test (opt-in via workflow_dispatch)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.smoke_test == true }}
        run: |
          echo "Running smoke test against https://cataito.com/en ..."
          curl -sSI https://cataito.com/en | head -20
          echo "---"
          curl -sSI https://cataito.com/en/tool/chatgpt | head -20
          echo "---"
          curl -sSI https://cataito.com/zh | head -20
          echo "---"
          curl -sSI https://cataito.com/tool/chatgpt | head -20
